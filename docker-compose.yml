services:
  postgres:
    image: postgres:16-alpine
    container_name: seeds_db
    environment:
      POSTGRES_USER: seeds
      POSTGRES_PASSWORD: seeds
      POSTGRES_DB: seeds_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeds -d seeds_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
